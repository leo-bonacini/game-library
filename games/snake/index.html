<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake</title>
  <link rel="stylesheet" href="../../shared/theme.css">
  <script src="../../games.js"></script>
  <script src="../../shared/layout.js" data-game="snake"></script>
  <style>
    :root {
      --snake: #2fb861;
      --snake-head: #1f8c47;
      --food: #e6483f;
      --board: #e9f2ec;
      --board-alt: #e1ece5;
    }

    :root[data-theme="dark"] {
      --snake: #4fd18f;
      --snake-head: #8ff0bb;
      --food: #ff6b6b;
      --board: #182320;
      --board-alt: #1c2925;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .app {
      width: min(520px, 100%);
      margin: 0 auto;
      padding: 20px 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .hud {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stat {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 10px;
      background: var(--gl-surface);
      border: 1px solid var(--gl-border);
      border-radius: var(--gl-radius-sm);
      box-shadow: var(--gl-shadow-sm);
    }

    .stat span {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gl-muted);
    }

    .stat strong {
      font-size: 1.25rem;
      font-variant-numeric: tabular-nums;
    }

    .icon-btn {
      width: 48px;
      align-self: stretch;
      border: 1px solid var(--gl-border);
      border-radius: var(--gl-radius-sm);
      background: var(--gl-surface);
      color: var(--gl-fg);
      font: inherit;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: var(--gl-shadow-sm);
    }

    .icon-btn:hover:not(:disabled) { background: var(--gl-surface-2); }
    .icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .board-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      border-radius: var(--gl-radius);
      overflow: hidden;
      border: 1px solid var(--gl-border);
      box-shadow: var(--gl-shadow);
      touch-action: none;
    }

    .board-wrap.walls { border: 3px solid var(--gl-fg); }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--gl-overlay);
    }

    .overlay[hidden] { display: none; }

    .card {
      width: min(320px, 100%);
      padding: 24px;
      text-align: center;
      background: var(--gl-surface);
      border: 1px solid var(--gl-border);
      border-radius: var(--gl-radius);
      box-shadow: var(--gl-shadow);
    }

    .card h2 {
      margin: 0 0 6px;
      font-size: 1.3rem;
    }

    .card p {
      margin: 0 0 16px;
      color: var(--gl-muted);
      font-size: 0.9rem;
    }

    .option {
      margin-bottom: 14px;
      text-align: left;
    }

    .option-label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--gl-muted);
    }

    .segmented {
      display: flex;
      gap: 4px;
      padding: 4px;
      background: var(--gl-surface-2);
      border-radius: var(--gl-radius-sm);
    }

    .segmented button {
      flex: 1;
      padding: 8px 6px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--gl-muted);
      font: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
    }

    .segmented button[aria-pressed="true"] {
      background: var(--gl-surface);
      color: var(--gl-fg);
      box-shadow: var(--gl-shadow-sm);
    }

    .btn {
      width: 100%;
      margin-top: 6px;
      padding: 11px 18px;
      border: 1px solid var(--gl-border);
      border-radius: var(--gl-radius-sm);
      background: var(--gl-surface);
      color: var(--gl-fg);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .btn:hover { background: var(--gl-surface-2); }

    .btn.primary {
      border-color: var(--gl-accent);
      background: var(--gl-accent);
      color: var(--gl-accent-fg);
    }

    .btn.primary:hover { background: var(--gl-accent-hover); }

    .btn:focus-visible, .segmented button:focus-visible, .icon-btn:focus-visible, .pad button:focus-visible {
      outline: 2px solid var(--gl-accent);
      outline-offset: 2px;
    }

    .final-score {
      margin: 4px 0 2px;
      font-size: 2.6rem;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .new-best { color: var(--gl-success); font-weight: 700; }

    .pad {
      display: none;
      grid-template-columns: repeat(3, 64px);
      grid-template-rows: repeat(2, 56px);
      gap: 8px;
      justify-content: center;
    }

    .pad button {
      border: 1px solid var(--gl-border);
      border-radius: var(--gl-radius-sm);
      background: var(--gl-surface);
      color: var(--gl-fg);
      font-size: 1.3rem;
      box-shadow: var(--gl-shadow-sm);
      touch-action: manipulation;
    }

    .pad button:active { background: var(--gl-surface-2); }
    .pad [data-dir="up"] { grid-column: 2; }
    .pad [data-dir="left"] { grid-column: 1; grid-row: 2; }
    .pad [data-dir="down"] { grid-column: 2; grid-row: 2; }
    .pad [data-dir="right"] { grid-column: 3; grid-row: 2; }

    .hint {
      margin: 0;
      text-align: center;
      font-size: 0.8rem;
      color: var(--gl-muted);
    }

    kbd {
      padding: 1px 6px;
      border-radius: 5px;
      background: var(--gl-surface-2);
      font-family: inherit;
    }

    @media (pointer: coarse) {
      .pad { display: grid; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <button id="sound-btn" title="Sound" aria-label="Mute sound" data-gl-action>🔊</button>

  <main class="app">
    <div class="hud">
      <div class="stat"><span>Score</span><strong id="score">0</strong></div>
      <div class="stat"><span>Best</span><strong id="best">0</strong></div>
      <div class="stat"><span>Length</span><strong id="length">3</strong></div>
      <button class="icon-btn" id="pause-btn" aria-label="Pause" title="Pause (Space)" disabled>⏸</button>
    </div>

    <div class="board-wrap" id="board-wrap">
      <canvas id="board" role="img" aria-label="Snake board"></canvas>

      <div class="overlay" id="start-screen">
        <div class="card">
          <h2>Snake</h2>
          <p>Eat the food to grow. Don't hit yourself.</p>
          <div class="option">
            <span class="option-label" id="speed-label">Speed</span>
            <div class="segmented" id="speed" role="group" aria-labelledby="speed-label">
              <button type="button" data-value="slow">Slow</button>
              <button type="button" data-value="normal">Normal</button>
              <button type="button" data-value="fast">Fast</button>
            </div>
          </div>
          <div class="option">
            <span class="option-label" id="walls-label">Edges</span>
            <div class="segmented" id="walls" role="group" aria-labelledby="walls-label">
              <button type="button" data-value="solid">Solid walls</button>
              <button type="button" data-value="wrap">Wrap around</button>
            </div>
          </div>
          <button class="btn primary" id="start-btn">Start</button>
          <a class="gl-back-link" href="../../index.html">← Back to library</a>
        </div>
      </div>

      <div class="overlay" id="pause-screen" hidden>
        <div class="card">
          <h2>Paused</h2>
          <p>Press Space or tap Resume.</p>
          <button class="btn primary" id="resume-btn">Resume</button>
          <button class="btn" id="quit-btn">Quit to menu</button>
        </div>
      </div>

      <div class="overlay" id="over-screen" hidden>
        <div class="card">
          <h2 id="over-title">Game over</h2>
          <div class="final-score" id="final-score">0</div>
          <p id="over-detail"></p>
          <button class="btn primary" id="again-btn">Play again</button>
          <button class="btn" id="menu-btn">Change settings</button>
        </div>
      </div>
    </div>

    <div class="pad" aria-label="Direction controls">
      <button type="button" data-dir="up" aria-label="Up">▲</button>
      <button type="button" data-dir="left" aria-label="Left">◀</button>
      <button type="button" data-dir="down" aria-label="Down">▼</button>
      <button type="button" data-dir="right" aria-label="Right">▶</button>
    </div>

    <p class="hint"><kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> to move · <kbd>Space</kbd> to pause</p>
  </main>

  <script>
  (function () {
    const GRID = 20;
    const SPEEDS = { slow: 150, normal: 105, fast: 70 };
    const MIN_TICK = 45;
    const SPEEDUP_EVERY = 5;
    const SPEEDUP_MS = 4;
    const DIRS = {
      up: { x: 0, y: -1 },
      down: { x: 0, y: 1 },
      left: { x: -1, y: 0 },
      right: { x: 1, y: 0 },
    };
    const KEYS = {
      ArrowUp: "up", KeyW: "up",
      ArrowDown: "down", KeyS: "down",
      ArrowLeft: "left", KeyA: "left",
      ArrowRight: "right", KeyD: "right",
    };

    const $ = (id) => document.getElementById(id);
    const canvas = $("board");
    const ctx = canvas.getContext("2d");
    const boardWrap = $("board-wrap");
    const startScreen = $("start-screen");
    const pauseScreen = $("pause-screen");
    const overScreen = $("over-screen");
    const pauseBtn = $("pause-btn");
    const soundBtn = $("sound-btn");

    function load(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw === null ? fallback : JSON.parse(raw);
      } catch {
        return fallback;
      }
    }

    function save(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
    }

    const settings = Object.assign({ speed: "normal", walls: "solid", sound: true }, load("snake.settings", {}));
    const bestKey = () => `snake.best.${settings.speed}.${settings.walls}`;

    let snake, dir, queue, food, score, tick, eaten;
    let status = "menu"; // menu | playing | paused | over
    let lastTime = 0;
    let acc = 0;
    let colors = {};

    function readColors() {
      const css = getComputedStyle(document.documentElement);
      const v = (name) => css.getPropertyValue(name).trim();
      colors = {
        snake: v("--snake"),
        head: v("--snake-head"),
        food: v("--food"),
        board: v("--board"),
        boardAlt: v("--board-alt"),
        eye: v("--gl-bg"),
      };
    }

    function resize() {
      const size = canvas.clientWidth;
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.round(size * ratio);
      canvas.height = Math.round(size * ratio);
      ctx.setTransform(canvas.width / GRID, 0, 0, canvas.height / GRID, 0, 0);
      draw();
    }

    function reset() {
      const mid = Math.floor(GRID / 2);
      snake = [{ x: mid, y: mid }, { x: mid - 1, y: mid }, { x: mid - 2, y: mid }];
      dir = DIRS.right;
      queue = [];
      score = 0;
      eaten = 0;
      tick = SPEEDS[settings.speed];
      food = placeFood();
      updateHud();
    }

    function placeFood() {
      const taken = new Set(snake.map((p) => p.y * GRID + p.x));
      if (taken.size >= GRID * GRID) return null;
      let i;
      do { i = Math.floor(Math.random() * GRID * GRID); } while (taken.has(i));
      return { x: i % GRID, y: Math.floor(i / GRID) };
    }

    function updateHud() {
      $("score").textContent = score;
      $("best").textContent = load(bestKey(), 0);
      $("length").textContent = snake.length;
    }

    function turn(name) {
      if (status !== "playing") return;
      const next = DIRS[name];
      const last = queue.length ? queue[queue.length - 1] : dir;
      // Queue up to two turns so quick key presses between ticks aren't lost
      if (next === last || (next.x === -last.x && next.y === -last.y)) return;
      if (queue.length < 2) queue.push(next);
    }

    function step() {
      if (queue.length) dir = queue.shift();
      let x = snake[0].x + dir.x;
      let y = snake[0].y + dir.y;

      if (settings.walls === "wrap") {
        x = (x + GRID) % GRID;
        y = (y + GRID) % GRID;
      } else if (x < 0 || y < 0 || x >= GRID || y >= GRID) {
        return gameOver(false);
      }

      const grows = food && x === food.x && y === food.y;
      // The tail leaves its cell this tick unless the snake grows
      const body = grows ? snake : snake.slice(0, -1);
      if (body.some((p) => p.x === x && p.y === y)) return gameOver(false);

      snake.unshift({ x, y });
      if (grows) {
        score += 10;
        eaten++;
        if (eaten % SPEEDUP_EVERY === 0) tick = Math.max(MIN_TICK, tick - SPEEDUP_MS);
        food = placeFood();
        beep(660, 0.06);
        if (!food) return gameOver(true);
      } else {
        snake.pop();
      }
      updateHud();
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function draw() {
      ctx.fillStyle = colors.board;
      ctx.fillRect(0, 0, GRID, GRID);
      ctx.fillStyle = colors.boardAlt;
      for (let y = 0; y < GRID; y++) {
        for (let x = y % 2; x < GRID; x += 2) ctx.fillRect(x, y, 1, 1);
      }

      if (food) {
        ctx.fillStyle = colors.food;
        ctx.beginPath();
        ctx.arc(food.x + 0.5, food.y + 0.5, 0.38, 0, Math.PI * 2);
        ctx.fill();
      }

      snake.forEach((p, i) => {
        ctx.fillStyle = i === 0 ? colors.head : colors.snake;
        roundRect(p.x + 0.06, p.y + 0.06, 0.88, 0.88, i === 0 ? 0.3 : 0.22);
        ctx.fill();
      });

      const head = snake[0];
      const ex = head.x + 0.5 + dir.x * 0.18;
      const ey = head.y + 0.5 + dir.y * 0.18;
      ctx.fillStyle = colors.eye;
      for (const side of [-1, 1]) {
        ctx.beginPath();
        ctx.arc(ex + dir.y * 0.2 * side, ey + dir.x * 0.2 * side, 0.09, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function loop(time) {
      if (status !== "playing") return;
      acc += time - lastTime;
      lastTime = time;
      // After a long frame, don't make the snake jump several cells at once
      if (acc > tick * 3) acc = tick;
      while (acc >= tick && status === "playing") {
        acc -= tick;
        step();
      }
      draw();
      requestAnimationFrame(loop);
    }

    function show(screen) {
      for (const s of [startScreen, pauseScreen, overScreen]) s.hidden = s !== screen;
    }

    function run() {
      status = "playing";
      acc = 0;
      lastTime = performance.now();
      requestAnimationFrame(loop);
    }

    function applyWalls() {
      boardWrap.classList.toggle("walls", settings.walls === "solid");
      resize();
    }

    function start() {
      reset();
      show(null);
      pauseBtn.disabled = false;
      pauseBtn.textContent = "⏸";
      pauseBtn.setAttribute("aria-label", "Pause");
      draw();
      run();
    }

    function pause() {
      if (status !== "playing") return;
      status = "paused";
      show(pauseScreen);
      pauseBtn.textContent = "▶";
      pauseBtn.setAttribute("aria-label", "Resume");
      $("resume-btn").focus();
    }

    function resume() {
      if (status !== "paused") return;
      show(null);
      pauseBtn.textContent = "⏸";
      pauseBtn.setAttribute("aria-label", "Pause");
      run();
    }

    function gameOver(won) {
      status = "over";
      pauseBtn.disabled = true;
      const best = load(bestKey(), 0);
      const isBest = score > best;
      if (isBest) save(bestKey(), score);
      updateHud();
      draw();
      const mode = `${settings.speed[0].toUpperCase()}${settings.speed.slice(1)}, ${settings.walls === "solid" ? "solid walls" : "wrap around"}`;
      const detail = $("over-detail");
      $("over-title").textContent = won ? "You filled the board!" : "Game over";
      $("final-score").textContent = score;
      detail.className = isBest ? "new-best" : "";
      detail.textContent = isBest ? `New best for ${mode}!` : `Best for ${mode}: ${best}`;
      beep(won ? 880 : 180, 0.25);
      show(overScreen);
      $("again-btn").focus();
    }

    function toMenu() {
      status = "menu";
      pauseBtn.disabled = true;
      pauseBtn.textContent = "⏸";
      show(startScreen);
      $("start-btn").focus();
    }

    let audio;
    function beep(freq, duration) {
      if (!settings.sound) return;
      try {
        audio = audio || new (window.AudioContext || window.webkitAudioContext)();
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        osc.type = "square";
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.06, audio.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + duration);
        osc.connect(gain).connect(audio.destination);
        osc.start();
        osc.stop(audio.currentTime + duration);
      } catch {}
    }

    function renderSound() {
      soundBtn.textContent = settings.sound ? "🔊" : "🔈";
      soundBtn.setAttribute("aria-label", settings.sound ? "Mute sound" : "Unmute sound");
    }

    function bindSegmented(id, key) {
      const group = $(id);
      const render = () => group.querySelectorAll("button").forEach((b) =>
        b.setAttribute("aria-pressed", b.dataset.value === settings[key]));
      group.addEventListener("click", (e) => {
        const btn = e.target.closest("button");
        if (!btn) return;
        settings[key] = btn.dataset.value;
        save("snake.settings", settings);
        render();
        updateHud();
        applyWalls();
      });
      render();
    }

    bindSegmented("speed", "speed");
    bindSegmented("walls", "walls");
    $("start-btn").addEventListener("click", start);
    $("again-btn").addEventListener("click", start);
    $("menu-btn").addEventListener("click", toMenu);
    $("resume-btn").addEventListener("click", resume);
    $("quit-btn").addEventListener("click", toMenu);
    pauseBtn.addEventListener("click", () => (status === "paused" ? resume() : pause()));
    soundBtn.addEventListener("click", () => {
      settings.sound = !settings.sound;
      save("snake.settings", settings);
      renderSound();
    });

    document.addEventListener("keydown", (e) => {
      if (KEYS[e.code]) {
        if (status === "playing") e.preventDefault();
        turn(KEYS[e.code]);
      } else if (e.code === "Space" || e.code === "KeyP") {
        if (status === "playing" || status === "paused") {
          e.preventDefault();
          if (status === "playing") pause();
          else resume();
        }
      } else if (e.code === "Escape") {
        pause();
      }
    });

    document.querySelectorAll(".pad button").forEach((b) =>
      b.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        turn(b.dataset.dir);
      }));

    let touchStart = null;
    boardWrap.addEventListener("touchstart", (e) => {
      if (status !== "playing") return;
      const t = e.touches[0];
      touchStart = { x: t.clientX, y: t.clientY };
    }, { passive: true });
    boardWrap.addEventListener("touchmove", (e) => {
      if (!touchStart || status !== "playing") return;
      e.preventDefault();
      const t = e.touches[0];
      const dx = t.clientX - touchStart.x;
      const dy = t.clientY - touchStart.y;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
      turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
      touchStart = { x: t.clientX, y: t.clientY };
    }, { passive: false });
    boardWrap.addEventListener("touchend", () => { touchStart = null; });

    document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });
    window.addEventListener("gl-themechange", () => { readColors(); draw(); });
    window.addEventListener("resize", resize);

    readColors();
    renderSound();
    reset();
    applyWalls();
    $("start-btn").focus();
  })();
  </script>
</body>
</html>
