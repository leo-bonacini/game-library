<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__TITLE__</title>
  <!-- Shared library look: theme tokens (--gl-*), top bar, light/dark toggle -->
  <link rel="stylesheet" href="../../shared/theme.css">
  <script src="../../games.js"></script>
  <script src="../../shared/layout.js" data-game="__SLUG__"></script>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .game {
      margin: auto;
      width: min(480px, calc(100% - 32px));
      padding: 28px;
      text-align: center;
      background: var(--gl-surface);
      border: 1px solid var(--gl-border);
      border-radius: var(--gl-radius);
      box-shadow: var(--gl-shadow);
    }
    .game p { color: var(--gl-muted); }
    .btn {
      font: inherit; font-weight: 600; padding: 10px 18px; border: 0; cursor: pointer;
      border-radius: var(--gl-radius-sm); background: var(--gl-accent); color: var(--gl-accent-fg);
    }
    .btn:hover { background: var(--gl-accent-hover); }
  </style>
</head>
<body>
  <!-- Buttons marked data-gl-action are moved into the top bar, e.g.:
  <button id="sound-btn" title="Sound" data-gl-action>🔊</button> -->
  <main class="game">
    <p>__DESCRIPTION__</p>
    <button class="btn" id="start">Start</button>
  </main>
  <script>
    document.getElementById("start").addEventListener("click", () => {
      // Game logic goes here.
    });
  </script>
</body>
</html>
